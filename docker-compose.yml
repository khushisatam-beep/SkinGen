services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skingen-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: skingen-server
    ports:
      - "5000:5000"
    restart: unless-stopped
